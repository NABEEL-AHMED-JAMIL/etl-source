<div class="action-controls" style="margin-top: 15px;">
    <input nz-input id="search" class="search-input" placeholder="Search..." />
    <div class="action-buttons">
        <!-- notification button with badge (opens bell dropdown) -->
        <nz-badge nzShowZero nzSize="small" [nzCount]="getTotalNotifacation()"
            nz-dropdown [nzDropdownMenu]="bellAction">
            <button nz-button nzType="default" nzShape="circle" aria-label="Notifications">
                <i nz-icon nzType="bell"></i>
            </button>
        </nz-badge>
        <!-- more options button (opens moreAction dropdown) -->
        <button nz-button nzType="default" nzShape="circle" aria-label="More"
            nz-dropdown [nzDropdownMenu]="moreAction">
            <i nz-icon nzType="ellipsis"></i>
        </button>
        <!-- user avatar button (opens user dropdown) -->
        <button nz-button nzType="default" nzShape="circle" aria-label="User"
            nz-dropdown [nzDropdownMenu]="userAction">
            <nz-avatar [nzSrc]="'./assets/avatar/' + sessionUser.profileImage" nzSize="small"></nz-avatar>
        </button>
    </div>
</div>

<!-- notifaction -->
<nz-dropdown-menu #bellAction="nzDropdownMenu">
    <app-notifaction-action
        [jobNotificationData]="jobNotificationData"
        [userNotificationData]="userNotificationData">
    </app-notifaction-action>
</nz-dropdown-menu>
<!-- more options dropdown menu -->
<nz-dropdown-menu #moreAction="nzDropdownMenu">
    <app-more-action [sessionUser]="sessionUser"></app-more-action>
</nz-dropdown-menu>
<!-- user -->
<nz-dropdown-menu #userAction="nzDropdownMenu">
    <app-user-action [sessionUser]="sessionUser"></app-user-action>
</nz-dropdown-menu>
