<nz-layout class="layout">
    <nz-header>
        <div nz-row class="app-header">
            <div nz-col [nzSpan]="16" [nzXs]="{ span: 2 }" [nzSm]="{ span: 2 }" [nzMd]="{ span: 2 }"
                style="text-align: center;">
                <a routerLink="/dashboard" style="color: black;align-items: center;">
                    <b>{{ title }}</b>
                </a>
            </div>
            <div nz-col [nzSpan]="16" [nzXs]="{ span: 14 }" [nzSm]="{ span: 14 }" [nzMd]="{ span: 14 }">
                <ul nz-menu nzMode="horizontal">
                    <li *ngIf="commomService.hasPermissionAccess(['SOURCE_ACTION_PERMISSION'])" class="hli"
                        nz-menu-item>
                        <a nz-dropdown [nzDropdownMenu]="menu">
                            <span nz-icon nzType="fire"></span>
                            Source Action
                        </a>
                    </li>
                    <li *ngIf="commomService.hasPermissionAccess(['ADMIN_PAGE_PERMISSION'])" class="hli" nz-menu-item
                        routerLink="/setting">
                        <span nz-icon nzType="setting" nzTheme="outline"></span>
                        App Setting
                    </li>
                    <li *ngIf="commomService.hasPermissionAccess(['REPORT_PAGE_PERMISSION'])" nz-menu-item class="hli"
                        routerLink="/report">
                        <span nz-icon nzType="line-chart" nzTheme="outline"></span>
                        Report & Dashboard
                    </li>
                    <li *ngIf="commomService.hasPermissionAccess(['FAKE_DATA_PAGE_PERMISSION'])" nz-menu-item
                        class="hli" routerLink="/setting">
                        <span nz-icon nzType="file-sync" nzTheme="outline"></span>
                        Generate Fake Data
                    </li>
                </ul>
            </div>
            <div nz-col [nzSpan]="16" [nzXs]="{ span: 8 }" [nzSm]="{ span: 8 }" [nzMd]="{ span: 8 }"
                style="text-align: end; padding-right: 20px;">
                <action-header-list></action-header-list>
            </div>
        </div>
    </nz-header>
    <nz-content style="margin-top: 75px;">
        <!-- breadcrumb -->
        <app-breadcrumb></app-breadcrumb>
        <router-outlet></router-outlet>
    </nz-content>
</nz-layout>
<!-- source job-menu -->
<nz-dropdown-menu #menu="nzDropdownMenu">
    <ul nz-menu nzSelectable>
        <li *ngIf="commomService.hasPermissionAccess(['RUNNING_SOURCE_JOB_PERMISSION'])" nz-menu-item>
            <span nz-icon nzType="play-circle" nzTheme="outline"></span>&nbsp;
            Running Source Jobs
        </li>
        <li *ngIf="commomService.hasPermissionAccess(['SOURCE_JOB_HISTORY_PERMISSION'])" nz-menu-item>
            <span nz-icon nzType="history" nzTheme="outline"></span>&nbsp;
            Source Jobs History
        </li>
    </ul>
</nz-dropdown-menu>
